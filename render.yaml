services:
  - type: web
    name: coyoacan-dashboard
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 2 run:app
    envVars:
      - key: DATABASE_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
